
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DentAI Dataset Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="dataset.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0a0d14;--bg2:#0f1320;--bg3:#151a28;
--card:rgba(255,255,255,.04);--card-border:rgba(255,255,255,.08);
--accent:#3b82f6;--accent2:#6366f1;--teal:#14b8a6;
--text:#e2e8f0;--muted:#64748b;--dim:#94a3b8;
}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 28px;background:rgba(15,19,32,.97);border-bottom:1px solid var(--card-border);position:sticky;top:0;z-index:100;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.logo-text{font-size:1.1rem;font-weight:700}
.logo-text span{color:var(--accent)}
.split-tabs{display:flex;gap:6px}
.split-tab{padding:6px 16px;border-radius:8px;border:1px solid var(--card-border);background:transparent;color:var(--dim);font-size:.8rem;cursor:pointer;font-family:inherit}
.split-tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.stats-badge{font-size:.75rem;color:var(--muted);background:var(--card);border:1px solid var(--card-border);border-radius:20px;padding:6px 12px}
.stats-badge strong{color:var(--accent)}
.image-name-bar{background:linear-gradient(90deg,rgba(59,130,246,.12),rgba(99,102,241,.12));border-bottom:1px solid rgba(59,130,246,.2);padding:10px 28px;display:flex;align-items:center;gap:12px}
.img-label{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.img-name{font-size:.85rem;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.img-counter{font-size:.75rem;color:var(--dim);white-space:nowrap;background:var(--card);border:1px solid var(--card-border);padding:3px 10px;border-radius:12px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:calc(100vh - 106px)}
.image-area{display:flex;flex-direction:column;min-width:0;background:var(--bg);border-right:1px solid var(--card-border)}
.canvas-wrapper{flex:1;min-height:350px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:24px}
#canvas{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.loading-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,13,20,.75);z-index:10;opacity:0;pointer-events:none}
.loading-overlay.visible{opacity:1;pointer-events:auto}
.spinner{width:40px;height:40px;border:3px solid var(--card-border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);font-size:.9rem;text-align:center;padding:24px}
.placeholder-icon{font-size:48px;opacity:.3}
.nav-bar{display:flex;align-items:center;gap:10px;padding:14px 24px;background:var(--bg2);border-top:1px solid var(--card-border);flex-wrap:wrap}
.nav-btn{display:flex;align-items:center;gap:6px;padding:9px 16px;border-radius:10px;border:1px solid var(--card-border);background:var(--card);color:var(--text);font-size:.85rem;cursor:pointer;font-family:inherit}
.nav-btn:hover:not(:disabled){background:rgba(59,130,246,.15);border-color:rgba(59,130,246,.4)}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.nav-btn svg{width:16px;height:16px}
.toggle-btn{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--card-border);background:var(--card);color:var(--dim);font-size:.78rem;cursor:pointer;font-family:inherit}
.toggle-btn.on{background:rgba(59,130,246,.15);border-color:rgba(59,130,246,.4);color:var(--accent)}
.toggle-dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.toggle-btn.on .toggle-dot{background:var(--accent)}
.jump-wrap{display:flex;align-items:center;gap:8px;margin-left:auto}
.jump-label{font-size:.75rem;color:var(--muted)}
.jump-input{width:70px;padding:7px 8px;background:var(--card);border:1px solid var(--card-border);border-radius:8px;color:var(--text);font-size:.85rem;text-align:center}
.jump-input:focus{outline:none;border-color:var(--accent)}
.pagination{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 12px;background:var(--bg2);border-top:1px solid var(--card-border);flex-wrap:wrap}
.page-btn{min-width:34px;padding:8px 10px;border-radius:8px;border:1px solid var(--card-border);background:var(--card);color:var(--text);cursor:pointer;font-family:inherit;font-size:.8rem}
.page-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.page-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.page-btn:disabled{opacity:.35;cursor:not-allowed}
.page-dots{color:var(--muted);padding:0 3px}
.page-info{font-size:.72rem;color:var(--muted);margin-left:5px}
.side-panel{display:flex;flex-direction:column;background:var(--bg2);overflow:hidden;min-height:0}
.panel-section{padding:16px;border-bottom:1px solid var(--card-border)}
.panel-title{font-size:.65rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.panel-title:before{content:'';width:3px;height:12px;border-radius:2px;background:var(--accent)}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.summary-card{background:var(--card);border:1px solid var(--card-border);border-radius:10px;padding:10px 12px}
.summary-val{font-size:1.4rem;font-weight:700;line-height:1}
.summary-key{font-size:.68rem;color:var(--muted);margin-top:5px}
.ann-list{flex:1;min-height:120px;max-height:45vh;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.ann-item{background:var(--card);border:1px solid var(--card-border);border-left:3px solid transparent;border-radius:10px;padding:10px 12px;cursor:pointer}
.ann-item:hover,.ann-item.highlighted{background:rgba(59,130,246,.08);border-left-color:var(--accent)}
.ann-header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ann-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.ann-name{font-size:.82rem;font-weight:600}
.ann-id-badge{margin-left:auto;font-size:.65rem;padding:2px 7px;border-radius:10px;background:rgba(255,255,255,.06);color:var(--muted)}
.ann-coords{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.ann-coord{display:flex;justify-content:space-between;gap:5px;font-size:.7rem}
.ann-coord-key{color:var(--muted)}
.ann-coord-val{font-weight:500;color:var(--dim);overflow-wrap:anywhere}
.empty-ann{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:32px 16px;color:var(--muted);font-size:.82rem;text-align:center}
.legend-scroll{overflow-y:auto;max-height:160px;display:flex;flex-direction:column;gap:4px}
.legend-row{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:6px;font-size:.75rem}
.legend-row:hover{background:var(--card)}
.legend-swatch{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.legend-cls{color:var(--dim);flex:1}
.kb-hint{padding:10px 16px;font-size:.68rem;color:var(--muted);border-top:1px solid var(--card-border);display:flex;gap:12px;flex-wrap:wrap}
.kb{display:flex;align-items:center;gap:4px}
.kbd{background:var(--card);border:1px solid var(--card-border);border-radius:4px;padding:1px 5px;font-size:.65rem;color:var(--dim)}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
*{scrollbar-width:thin;scrollbar-color:var(--card-border) transparent}
@media(max-width:850px){
 .main{grid-template-columns:1fr}
 .side-panel{border-top:1px solid var(--card-border)}
 .canvas-wrapper{min-height:300px;height:55vh}
 .ann-list{max-height:350px}
 header{padding:12px 16px}
 .image-name-bar{padding:10px 16px}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🦷</div>
    <div class="logo-text">Dent<span>AI</span> Viewer</div>
  </div>
  <div class="split-tabs">
    <button class="split-tab active" id="tab-train" onclick="changeSplit('train')">Train</button>
    <button class="split-tab" id="tab-valid" onclick="changeSplit('valid')">Valid</button>
    <button class="split-tab" id="tab-test" onclick="changeSplit('test')">Test</button>
  </div>
  <div class="stats-badge">Total: <strong id="total-count">—</strong> images</div>
</header>

<div class="image-name-bar">
  <span class="img-label">File</span>
  <span class="img-name" id="img-name-display">—</span>
  <span class="img-counter" id="img-counter">0 / 0</span>
</div>

<div class="main">
  <div class="image-area">
    <div class="canvas-wrapper" id="canvas-wrapper">
      <canvas id="canvas" style="display:none"></canvas>
      <div class="loading-overlay" id="loading-overlay"><div class="spinner"></div></div>
      <div class="placeholder" id="placeholder">
        <div class="placeholder-icon">🦷</div>
        <span id="placeholder-text">Loading dataset…</span>
      </div>
    </div>

    <div class="nav-bar">
      <button class="nav-btn" id="btn-prev" onclick="navigate(-1)" disabled>← Previous</button>
      <button class="nav-btn" id="btn-next" onclick="navigate(1)" disabled>Next →</button>
      <button class="toggle-btn on" id="overlay-toggle" onclick="toggleOverlay()">
        <div class="toggle-dot"></div><span id="toggle-label">Show Boxes</span>
      </button>
      
    </div>

    <div class="pagination" id="pagination"></div>
  </div>

  <div class="side-panel">
    <div class="panel-section">
      <div class="panel-title">Image Info</div>
      <div class="summary-grid">
        <div class="summary-card"><div class="summary-val" id="box-count">0</div><div class="summary-key">Annotations</div></div>
        <div class="summary-card"><div class="summary-val" id="class-count">0</div><div class="summary-key">Unique Classes</div></div>
        <div class="summary-card"><div class="summary-val" id="img-w">—</div><div class="summary-key">Width (px)</div></div>
        <div class="summary-card"><div class="summary-val" id="img-h">—</div><div class="summary-key">Height (px)</div></div>
      </div>
    </div>

    <div style="padding:12px 16px 0">
      <div class="panel-title" style="margin-bottom:0">Bounding Boxes</div>
    </div>
    <div class="ann-list" id="ann-list">
      <div class="empty-ann">No annotations loaded</div>
    </div>

    <div class="panel-section">
      <div class="panel-title">Class Legend</div>
      <div class="legend-scroll" id="legend"></div>
    </div>

    <div class="kb-hint">
      <div class="kb"><kbd class="kbd">←</kbd> Prev</div>
      <div class="kb"><kbd class="kbd">→</kbd> Next</div>
      <div class="kb"><kbd class="kbd">B</kbd> Boxes</div>
      <div class="kb"><kbd class="kbd">Enter</kbd> Jump</div>
    </div>
  </div>
</div>

<script>
const BASE_URL =
  window.location.port === '5500' || window.location.protocol === 'file:'
    ? `${window.location.protocol === 'file:' ? 'http:' : window.location.protocol}//${window.location.hostname || '127.0.0.1'}:5000`
    : window.location.origin;

const CLASS_NAMES = [
  'Attrition','Cyst','Dental Caries','Endodontically Treated Tooth',
  'Impacted Third Molar','Missing Tooth','Periapical Abnormality',
  'Periapical Lesion','Periodontal Pocket','Retained Root','Tooth Fracture'
];

const CLASS_COLORS = [
  '#f43f5e','#fb923c','#facc15','#4ade80','#22d3ee',
  '#818cf8','#c084fc','#f472b6','#34d399','#60a5fa','#fbbf24'
];

const IMAGES_PER_PAGE = 50;

const S = {
  split: 'train',
  images: [],
  index: 0,
  boxes: [],
  showOverlay: true,
  highlighted: -1,
  currentImg: null,
  imgCache: {},
  labelCache: {},
  loadToken: 0
};

let currentPage = 1;
const PRELOAD_AHEAD = 3;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const loading = document.getElementById('loading-overlay');
const ph = document.getElementById('placeholder');
const annList = document.getElementById('ann-list');
const legend = document.getElementById('legend');

function formatBox(b) {
  if (Array.isArray(b)) {
    const cid = Number(b[0]);
    return {
      class_id: cid,
      class_name: CLASS_NAMES[cid] || `Class ${cid}`,
      cx: Number(b[1]), cy: Number(b[2]),
      w: Number(b[3]), h: Number(b[4])
    };
  }

  const cid = Number(b.class_id ?? b.classId ?? b.cls ?? 0);
  return {
    ...b,
    class_id: cid,
    class_name: b.class_name || b.class || CLASS_NAMES[cid] || `Class ${cid}`,
    cx: Number(b.cx ?? b.x ?? 0),
    cy: Number(b.cy ?? b.y ?? 0),
    w: Number(b.w ?? b.width ?? 0),
    h: Number(b.h ?? b.height ?? 0)
  };
}

function getImgSrc(split, name) {
  return `${split}/images/${String(name).split('/').map(encodeURIComponent).join('/')}`;
}

function getTotalPages() {
  return Math.ceil(S.images.length / IMAGES_PER_PAGE);
}

function changeSplit(split) {
  S.split = split;
  S.images = [];
  S.index = 0;
  S.boxes = [];
  S.currentImg = null;
  S.imgCache = {};
  S.labelCache = {};
  S.loadToken++;

  ['train','valid','test'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === split);
  });

  loadSplit(split);
}

window.addEventListener('DOMContentLoaded', () => {
  buildLegend();
  loadSplit('train');
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') {
    if (e.key === 'Enter' && e.target.id === 'jump-input') jumpTo();
    return;
  }
  if (e.key === 'ArrowLeft') navigate(-1);
  if (e.key === 'ArrowRight') navigate(1);
  if (e.key.toLowerCase() === 'b') toggleOverlay();
});

window.addEventListener('resize', () => {
  if (S.currentImg) drawCanvas();
});

async function loadSplit(split) {
  const token = ++S.loadToken;
  showLoading(true);
  setPlaceholder('Loading dataset…');

  let images = [];
  let dataset = window.DATASET;

  if (!dataset) {
    try {
      const response = await fetch('dataset.json');
      if (response.ok) {
        dataset = await response.json();
        window.DATASET = dataset;
      }
    } catch (e) {}
  }

  if (token !== S.loadToken) return;

  if (dataset && dataset[split]) {
    images = dataset[split].images || [];
    const labels = dataset[split].labels || {};
    for (const [name, rawBoxes] of Object.entries(labels)) {
      S.labelCache[split + '/' + name] = (rawBoxes || []).map(formatBox);
    }
  } else {
    try {
      const response = await fetch(`${BASE_URL}/api/images?split=${encodeURIComponent(split)}`);
      if (response.ok) {
        const data = await response.json();
        images = data.images || [];
      }
    } catch (e) {
      console.warn('Could not load dataset:', e);
    }
  }

  if (token !== S.loadToken) return;

  S.images = images;
  S.index = 0;
  currentPage = 1;
  document.getElementById('total-count').textContent = images.length;
  renderPagination();

  if (!images.length) {
    canvas.style.display = 'none';
    setPlaceholder('No images found. Check dataset.js and image paths.');
    showLoading(false);
    updateNavigation();
    renderAnnotations();
    return;
  }

  ph.style.display = 'none';
  canvas.style.display = 'block';

  await showImage(0);
}

function renderPagination() {
  const container = document.getElementById('pagination');
  container.innerHTML = '';

  const totalPages = getTotalPages();
  if (totalPages <= 1) {
    container.style.display = 'none';
    return;
  }
  container.style.display = 'flex';

  function addButton(label, page, disabled = false, active = false) {
    const btn = document.createElement('button');
    btn.className = 'page-btn' + (active ? ' active' : '');
    btn.textContent = label;
    btn.disabled = disabled;
    btn.setAttribute('aria-label', `Page ${page}`);
    btn.onclick = () => {
      if (disabled || page < 1 || page > totalPages) return;
      currentPage = page;
      showImage((page - 1) * IMAGES_PER_PAGE);
      renderPagination();
    };
    container.appendChild(btn);
  }

  addButton('←', currentPage - 1, currentPage === 1);

  let start = Math.max(1, currentPage - 2);
  let end = Math.min(totalPages, currentPage + 2);

  if (start > 1) {
    addButton('1', 1, false, currentPage === 1);
    if (start > 2) {
      const dots = document.createElement('span');
      dots.className = 'page-dots';
      dots.textContent = '…';
      container.appendChild(dots);
    }
  }

  for (let page = start; page <= end; page++) {
    addButton(String(page), page, false, page === currentPage);
  }

  if (end < totalPages) {
    if (end < totalPages - 1) {
      const dots = document.createElement('span');
      dots.className = 'page-dots';
      dots.textContent = '…';
      container.appendChild(dots);
    }
    addButton(String(totalPages), totalPages, false, currentPage === totalPages);
  }

  addButton('→', currentPage + 1, currentPage === totalPages);

  const info = document.createElement('span');
  info.className = 'page-info';
  const first = (currentPage - 1) * IMAGES_PER_PAGE + 1;
  const last = Math.min(currentPage * IMAGES_PER_PAGE, S.images.length);
  info.textContent = `${first}–${last} of ${S.images.length}`;
  container.appendChild(info);
}

function updateNavigation() {
  document.getElementById('btn-prev').disabled = S.index <= 0;
  document.getElementById('btn-next').disabled = S.index >= S.images.length - 1;
}

function navigate(direction) {
  const nextIndex = S.index + direction;
  if (nextIndex < 0 || nextIndex >= S.images.length) return;
  showImage(nextIndex);
}

function jumpTo() {
  const input = document.getElementById('jump-input');
  const value = parseInt(input.value, 10);
  if (!Number.isFinite(value) || !S.images.length) return;

  const index = Math.max(0, Math.min(S.images.length - 1, value - 1));
  currentPage = Math.floor(index / IMAGES_PER_PAGE) + 1;
  renderPagination();
  showImage(index);
  input.value = '';
}

function preloadImg(split, name) {
  const key = split + '/' + name;
  if (S.imgCache[key]) return S.imgCache[key];

  const img = new Image();
  S.imgCache[key] = img;
  img.src = getImgSrc(split, name);
  return img;
}

async function prefetchLabels(split, start, end) {
  if (window.DATASET) return;

  const names = S.images.slice(start, end).filter(name =>
    S.labelCache[split + '/' + name] === undefined
  );

  if (!names.length) return;

  try {
    const response = await fetch(`${BASE_URL}/api/labels_batch`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({split, images:names})
    });

    if (!response.ok) return;
    const data = await response.json();

    for (const [name, boxes] of Object.entries(data)) {
      S.labelCache[split + '/' + name] = (boxes || []).map(formatBox);
    }
  } catch (e) {
    console.warn('Label prefetch failed:', e);
  }
}

function triggerPreload(index) {
  for (let i = index + 1; i <= index + PRELOAD_AHEAD && i < S.images.length; i++) {
    preloadImg(S.split, S.images[i]);
  }
  if (index > 0) preloadImg(S.split, S.images[index - 1]);
  prefetchLabels(S.split, index, Math.min(index + PRELOAD_AHEAD + 1, S.images.length));
}

async function showImage(index) {
  if (index < 0 || index >= S.images.length) return;

  const token = ++S.loadToken;
  S.index = index;
  S.highlighted = -1;
  currentPage = Math.floor(index / IMAGES_PER_PAGE) + 1;

  const name = S.images[index];
  document.getElementById('img-name-display').textContent = name;
  document.getElementById('img-counter').textContent = `${index + 1} / ${S.images.length}`;
  updateNavigation();
  renderPagination();

  const key = S.split + '/' + name;
  const img = preloadImg(S.split, name);

  if (!img.complete || img.naturalWidth === 0) {
    showLoading(true);

    const result = await new Promise(resolve => {
      if (img.complete) {
        resolve(img.naturalWidth > 0);
      } else {
        img.onload = () => resolve(true);
        img.onerror = () => resolve(false);
      }
    });

    if (token !== S.loadToken) return;

    if (!result) {
      canvas.style.display = 'none';
      setPlaceholder(`Could not load image: ${name}. Check the image path.`);
      showLoading(false);
      S.currentImg = null;
      S.boxes = [];
      renderAnnotations();
      return;
    }
  }

  if (token !== S.loadToken) return;

  S.currentImg = img;

  let boxes = S.labelCache[key];

  if (boxes === undefined && window.DATASET?.[S.split]?.labels?.[name]) {
    boxes = window.DATASET[S.split].labels[name].map(formatBox);
    S.labelCache[key] = boxes;
  }

  if (boxes === undefined && !window.DATASET) {
    try {
      const response = await fetch(
        `${BASE_URL}/api/labels?split=${encodeURIComponent(S.split)}&image=${encodeURIComponent(name)}`
      );
      if (response.ok) {
        const data = await response.json();
        boxes = (data.boxes || []).map(formatBox);
      }
    } catch (e) {
      boxes = [];
    }
  }

  if (token !== S.loadToken) return;

  S.boxes = boxes || [];
  canvas.style.display = 'block';
  ph.style.display = 'none';
  showLoading(false);

  drawCanvas();
  renderAnnotations();

  document.getElementById('img-w').textContent = img.naturalWidth;
  document.getElementById('img-h').textContent = img.naturalHeight;

  triggerPreload(index);
}

function drawCanvas() {
  const img = S.currentImg;
  if (!img || !img.naturalWidth) return;

  const wrap = document.getElementById('canvas-wrapper');
  const maxW = Math.max(100, wrap.clientWidth - 48);
  const maxH = Math.max(100, wrap.clientHeight - 48);
  const scale = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight, 1);

  canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
  canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

  if (!S.showOverlay) return;

  S.boxes.forEach((box, i) => {
    const col = CLASS_COLORS[((box.class_id % CLASS_COLORS.length) + CLASS_COLORS.length) % CLASS_COLORS.length];
    const x = (box.cx - box.w / 2) * canvas.width;
    const y = (box.cy - box.h / 2) * canvas.height;
    const w = box.w * canvas.width;
    const h = box.h * canvas.height;
    const highlighted = i === S.highlighted;

    ctx.fillStyle = col + (highlighted ? '33' : '1a');
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = col;
    ctx.lineWidth = highlighted ? 2.5 : 1.5;
    ctx.strokeRect(x, y, w, h);

    const label = `${i + 1}. ${box.class_name}`;
    ctx.font = 'bold 11px Inter,sans-serif';
    const textWidth = ctx.measureText(label).width;
    const labelY = y - 18 < 0 ? y + h + 18 : y - 2;
    ctx.fillStyle = col;
    ctx.fillRect(x, labelY - 14, textWidth + 10, 18);
    ctx.fillStyle = '#000';
    ctx.fillText(label, x + 5, labelY);
  });
}

function renderAnnotations() {
  const boxes = S.boxes || [];
  document.getElementById('box-count').textContent = boxes.length;
  document.getElementById('class-count').textContent = new Set(boxes.map(b => b.class_id)).size;

  if (!boxes.length) {
    annList.innerHTML = '<div class="empty-ann"><span style="font-size:28px">✅</span><span>No annotations for this image</span></div>';
    return;
  }

  annList.innerHTML = '';

  boxes.forEach((box, index) => {
    const col = CLASS_COLORS[((box.class_id % CLASS_COLORS.length) + CLASS_COLORS.length) % CLASS_COLORS.length];
    const W = S.currentImg?.naturalWidth || 0;
    const H = S.currentImg?.naturalHeight || 0;
    const px = (value, dimension) => dimension ? Math.round(value * dimension) : '—';

    const x1 = px(box.cx - box.w / 2, W);
    const y1 = px(box.cy - box.h / 2, H);
    const x2 = px(box.cx + box.w / 2, W);
    const y2 = px(box.cy + box.h / 2, H);

    const item = document.createElement('div');
    item.className = 'ann-item';

    item.innerHTML = `
      <div class="ann-header">
        <div class="ann-dot" style="background:${col}"></div>
        <div class="ann-name" style="color:${col}">${box.class_name}</div>
        <div class="ann-id-badge">#${index + 1} · cls ${box.class_id}</div>
      </div>
      <div class="ann-coords">
        <div class="ann-coord"><span class="ann-coord-key">cx</span><span class="ann-coord-val">${box.cx.toFixed(4)}</span></div>
        <div class="ann-coord"><span class="ann-coord-key">cy</span><span class="ann-coord-val">${box.cy.toFixed(4)}</span></div>
        <div class="ann-coord"><span class="ann-coord-key">w</span><span class="ann-coord-val">${box.w.toFixed(4)}</span></div>
        <div class="ann-coord"><span class="ann-coord-key">h</span><span class="ann-coord-val">${box.h.toFixed(4)}</span></div>
        <div class="ann-coord"><span class="ann-coord-key">x₁,y₁</span><span class="ann-coord-val">${x1}, ${y1}</span></div>
        <div class="ann-coord"><span class="ann-coord-key">x₂,y₂</span><span class="ann-coord-val">${x2}, ${y2}</span></div>
      </div>`;

    item.addEventListener('mouseenter', () => {
      S.highlighted = index;
      item.classList.add('highlighted');
      drawCanvas();
    });

    item.addEventListener('mouseleave', () => {
      S.highlighted = -1;
      item.classList.remove('highlighted');
      drawCanvas();
    });

    annList.appendChild(item);
  });
}

function buildLegend() {
  legend.innerHTML = '';
  CLASS_NAMES.forEach((name, index) => {
    const row = document.createElement('div');
    row.className = 'legend-row';
    row.innerHTML = `
      <div class="legend-swatch" style="background:${CLASS_COLORS[index]}"></div>
      <div class="legend-cls">${name}</div>`;
    legend.appendChild(row);
  });
}

function toggleOverlay() {
  S.showOverlay = !S.showOverlay;
  const button = document.getElementById('overlay-toggle');
  button.classList.toggle('on', S.showOverlay);
  document.getElementById('toggle-label').textContent = S.showOverlay ? 'Show Boxes' : 'Hide Boxes';
  drawCanvas();
}

function setPlaceholder(message) {
  ph.style.display = 'flex';
  document.getElementById('placeholder-text').textContent = message;
}

function showLoading(value) {
  loading.classList.toggle('visible', value);
}
</script>
