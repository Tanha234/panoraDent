<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DentAI Dataset Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0d14; --bg2: #0f1320; --bg3: #151a28;
      --card: rgba(255,255,255,0.04); --card-border: rgba(255,255,255,0.08);
      --accent: #3b82f6; --accent2: #6366f1; --teal: #14b8a6;
      --text: #e2e8f0; --muted: #64748b; --dim: #94a3b8;
    }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }

    /* HEADER */
    header {
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 28px;
      background:rgba(15,19,32,0.97);
      border-bottom:1px solid var(--card-border);
      backdrop-filter:blur(12px);
      position:sticky; top:0; z-index:100;
    }
    .logo { display:flex; align-items:center; gap:10px; }
    .logo-icon {
      width:36px; height:36px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px;
    }
    .logo-text { font-size:1.1rem; font-weight:700; letter-spacing:-0.3px; }
    .logo-text span { color:var(--accent); }
    .split-tabs { display:flex; gap:6px; }
    .split-tab {
      padding:6px 16px; border-radius:8px; border:1px solid var(--card-border);
      background:transparent; color:var(--dim); font-size:0.8rem; font-weight:500;
      cursor:pointer; transition:all .2s; font-family:inherit;
    }
    .split-tab:hover { background:var(--card); color:var(--text); }
    .split-tab.active {
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      border-color:transparent; color:#fff;
    }
    .stats-badge {
      font-size:0.75rem; color:var(--muted);
      background:var(--card); border:1px solid var(--card-border);
      border-radius:20px; padding:4px 12px;
    }
    .stats-badge strong { color:var(--accent); }

    /* IMAGE NAME BAR */
    .image-name-bar {
      background:linear-gradient(90deg,rgba(59,130,246,.12),rgba(99,102,241,.12));
      border-bottom:1px solid rgba(59,130,246,.2);
      padding:10px 28px; display:flex; align-items:center; gap:12px;
    }
    .img-label { font-size:.7rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
    .img-name { font-size:.85rem; font-weight:500; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .img-counter {
      font-size:.75rem; color:var(--dim); white-space:nowrap;
      background:var(--card); border:1px solid var(--card-border); padding:3px 10px; border-radius:12px;
    }

    /* MAIN LAYOUT */
    .main { display:grid; grid-template-columns:1fr 320px; height:calc(100vh - 106px); }

    /* IMAGE AREA */
    .image-area { display:flex; flex-direction:column; background:var(--bg); border-right:1px solid var(--card-border); }
    .canvas-wrapper {
      flex:1; display:flex; align-items:center; justify-content:center;
      position:relative; overflow:hidden; padding:24px;
    }
    #canvas {
      max-width:100%; max-height:100%; border-radius:12px;
      box-shadow:0 20px 60px rgba(0,0,0,.6); cursor:crosshair;
    }

    /* Loading */
    .loading-overlay {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      background:rgba(10,13,20,.75); backdrop-filter:blur(4px); border-radius:12px;
      z-index:10; opacity:0; pointer-events:none; transition:opacity .15s;
    }
    .loading-overlay.visible { opacity:1; pointer-events:auto; }
    .spinner {
      width:40px; height:40px; border:3px solid var(--card-border);
      border-top-color:var(--accent); border-radius:50%;
      animation:spin .8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    .placeholder { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:var(--muted); font-size:.9rem; }
    .placeholder-icon { font-size:48px; opacity:.3; }

    /* NAV BAR */
    .nav-bar {
      display:flex; align-items:center; gap:10px; padding:14px 24px;
      background:var(--bg2); border-top:1px solid var(--card-border);
    }
    .nav-btn {
      display:flex; align-items:center; gap:6px; padding:9px 20px;
      border-radius:10px; border:1px solid var(--card-border);
      background:var(--card); color:var(--text); font-size:.85rem; font-weight:500;
      cursor:pointer; transition:all .2s; font-family:inherit;
    }
    .nav-btn:hover:not(:disabled) {
      background:rgba(59,130,246,.15); border-color:rgba(59,130,246,.4);
      color:var(--accent); transform:translateY(-1px);
    }
    .nav-btn:disabled { opacity:.3; cursor:not-allowed; }
    .nav-btn svg { width:16px; height:16px; }

    .toggle-btn {
      display:flex; align-items:center; gap:6px; padding:7px 14px;
      border-radius:8px; border:1px solid var(--card-border);
      background:var(--card); color:var(--dim); font-size:.78rem; font-weight:500;
      cursor:pointer; font-family:inherit; transition:all .2s;
    }
    .toggle-btn.on { background:rgba(59,130,246,.15); border-color:rgba(59,130,246,.4); color:var(--accent); }
    .toggle-dot { width:8px; height:8px; border-radius:50%; background:var(--muted); transition:background .2s; }
    .toggle-btn.on .toggle-dot { background:var(--accent); }

    .jump-wrap { display:flex; align-items:center; gap:8px; margin-left:auto; }
    .jump-label { font-size:.75rem; color:var(--muted); }
    .jump-input {
      width:70px; padding:6px 10px; background:var(--card);
      border:1px solid var(--card-border); border-radius:8px; color:var(--text);
      font-size:.85rem; font-family:inherit; text-align:center; transition:border-color .2s;
    }
    .jump-input:focus { outline:none; border-color:var(--accent); }

    /* Preload indicator */
    .preload-dots { display:flex; gap:4px; align-items:center; margin-left:4px; }
    .pdot { width:6px; height:6px; border-radius:50%; background:var(--card-border); transition:background .3s; }
    .pdot.loaded { background:var(--teal); }

    /* SIDE PANEL */
    .side-panel { display:flex; flex-direction:column; background:var(--bg2); overflow:hidden; }
    .panel-section { padding:16px; border-bottom:1px solid var(--card-border); }
    .panel-title {
      font-size:.65rem; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted);
      margin-bottom:12px; display:flex; align-items:center; gap:6px;
    }
    .panel-title::before { content:''; width:3px; height:12px; border-radius:2px; background:var(--accent); display:block; }
    .summary-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .summary-card { background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:10px 12px; }
    .summary-val { font-size:1.4rem; font-weight:700; line-height:1; }
    .summary-key { font-size:.68rem; color:var(--muted); margin-top:3px; }

    .ann-list { flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:8px; }
    .ann-list::-webkit-scrollbar { width:4px; }
    .ann-list::-webkit-scrollbar-thumb { background:var(--card-border); border-radius:2px; }
    .ann-item {
      background:var(--card); border:1px solid var(--card-border); border-left:3px solid transparent;
      border-radius:10px; padding:10px 12px; cursor:pointer; transition:all .15s;
      animation:fadeIn .2s ease both;
    }
    .ann-item:hover { background:rgba(255,255,255,.06); }
    .ann-item.highlighted { background:rgba(59,130,246,.08); border-left-color:var(--accent); }
    .ann-header { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
    .ann-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
    .ann-name { font-size:.82rem; font-weight:600; }
    .ann-id-badge {
      margin-left:auto; font-size:.65rem; padding:2px 7px; border-radius:10px;
      background:rgba(255,255,255,.06); color:var(--muted);
    }
    .ann-coords { display:grid; grid-template-columns:1fr 1fr; gap:4px; }
    .ann-coord { display:flex; justify-content:space-between; font-size:.72rem; }
    .ann-coord-key { color:var(--muted); }
    .ann-coord-val { font-weight:500; color:var(--dim); font-family:'Fira Code',monospace; }
    .empty-ann {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:10px; padding:32px 16px; color:var(--muted); font-size:.82rem; text-align:center;
    }

    .legend-scroll { overflow-y:auto; max-height:160px; display:flex; flex-direction:column; gap:4px; }
    .legend-row { display:flex; align-items:center; gap:8px; padding:4px 8px; border-radius:6px; font-size:.75rem; transition:background .15s; }
    .legend-row:hover { background:var(--card); }
    .legend-swatch { width:12px; height:12px; border-radius:3px; flex-shrink:0; }
    .legend-cls { color:var(--dim); flex:1; }
    .legend-cnt { font-size:.68rem; background:var(--card); border:1px solid var(--card-border); padding:1px 7px; border-radius:8px; color:var(--muted); }

    .kb-hint { padding:10px 16px; font-size:.68rem; color:var(--muted); border-top:1px solid var(--card-border); display:flex; gap:12px; flex-wrap:wrap; }
    .kb { display:flex; align-items:center; gap:4px; }
    .kbd { background:var(--card); border:1px solid var(--card-border); border-radius:4px; padding:1px 5px; font-size:.65rem; color:var(--dim); }

    @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }
    * { scrollbar-width:thin; scrollbar-color:var(--card-border) transparent; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🦷</div>
    <div class="logo-text">Dent<span>AI</span> Viewer</div>
  </div>
  <div class="split-tabs">
    <button class="split-tab active" id="tab-train" onclick="changeSplit('train')">Train</button>
    <button class="split-tab"        id="tab-valid" onclick="changeSplit('valid')">Valid</button>
    <button class="split-tab"        id="tab-test"  onclick="changeSplit('test')">Test</button>
  </div>
  <div class="stats-badge">Total: <strong id="total-count">—</strong> images</div>
</header>

<div class="image-name-bar">
  <span class="img-label">File</span>
  <span class="img-name"  id="img-name-display">—</span>
  <span class="img-counter" id="img-counter">0 / 0</span>
</div>

<div class="main">

  <!-- IMAGE AREA -->
  <div class="image-area">
    <div class="canvas-wrapper" id="canvas-wrapper">
      <canvas id="canvas"></canvas>
      <div class="loading-overlay" id="loading-overlay"><div class="spinner"></div></div>
      <div class="placeholder" id="placeholder">
        <div class="placeholder-icon">🦷</div><span>Loading…</span>
      </div>
    </div>

    <div class="nav-bar">
      <button class="nav-btn" id="btn-prev" onclick="navigate(-1)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        Previous
      </button>
      <button class="nav-btn" id="btn-next" onclick="navigate(1)" disabled>
        Next
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>

      <!-- Preload indicator dots -->
      <div class="preload-dots" title="Preload status: prev / current / next">
        <div class="pdot" id="pd-prev"></div>
        <div class="pdot" id="pd-curr"></div>
        <div class="pdot" id="pd-next"></div>
      </div>

      <button class="toggle-btn on" id="overlay-toggle" onclick="toggleOverlay()">
        <div class="toggle-dot"></div>
        <span id="toggle-label">&nbsp;Show Boxes</span>
      </button>

      <div class="jump-wrap">
        <span class="jump-label">Go to #</span>
        <input class="jump-input" id="jump-input" type="number" min="1" placeholder="1"
               onkeydown="if(event.key==='Enter')jumpTo()" />
      </div>
    </div>
  </div>

  <!-- SIDE PANEL -->
  <div class="side-panel">
    <div class="panel-section">
      <div class="panel-title">Image Info</div>
      <div class="summary-grid">
        <div class="summary-card"><div class="summary-val" id="box-count">0</div><div class="summary-key">Annotations</div></div>
        <div class="summary-card"><div class="summary-val" id="class-count">0</div><div class="summary-key">Unique Classes</div></div>
        <div class="summary-card"><div class="summary-val" id="img-w">—</div><div class="summary-key">Width (px)</div></div>
        <div class="summary-card"><div class="summary-val" id="img-h">—</div><div class="summary-key">Height (px)</div></div>
      </div>
    </div>

    <div style="padding:12px 16px 0">
      <div class="panel-title" style="margin-bottom:0">Bounding Boxes</div>
    </div>
    <div class="ann-list" id="ann-list">
      <div class="empty-ann"><div style="font-size:32px;opacity:.3">📋</div><span>No annotations loaded</span></div>
    </div>

    <div class="panel-section">
      <div class="panel-title">Class Legend</div>
      <div class="legend-scroll" id="legend"></div>
    </div>

    <div class="kb-hint">
      <div class="kb"><kbd class="kbd">←</kbd>&nbsp;Prev</div>
      <div class="kb"><kbd class="kbd">→</kbd>&nbsp;Next</div>
      <div class="kb"><kbd class="kbd">B</kbd>&nbsp;Boxes</div>
      <div class="kb"><kbd class="kbd">Enter</kbd>&nbsp;Jump</div>
    </div>
  </div>

</div><!-- /main -->

<script>
// ── Constants ───────────────────────────────────────────────────────────────
const BASE_URL = 'http://127.0.0.1:5000';
const CLASS_NAMES = [
  'Attrition','Cyst','Dental Caries','Endodontically Treated Tooth',
  'Impacted Third Molar','Missing Tooth','Periapical Abnormality',
  'Periapical Lesion','Periodontal Pocket','Retained Root','Tooth Fracture'
];
const CLASS_COLORS = [
  '#f43f5e','#fb923c','#facc15','#4ade80','#22d3ee',
  '#818cf8','#c084fc','#f472b6','#34d399','#60a5fa','#fbbf24'
];

// ── State ────────────────────────────────────────────────────────────────────
const S = {
  split: 'train',
  images: [],        // filenames
  index: 0,
  boxes: [],         // current boxes
  showOverlay: true,
  highlighted: -1,

  // Preload cache: key = "split/filename" → HTMLImageElement
  imgCache: {},
  // Label cache: key = "split/filename" → boxes[]
  labelCache: {}
};

const PRELOAD_AHEAD = 3;  // preload N images ahead and 1 behind

// ── DOM ──────────────────────────────────────────────────────────────────────
const canvas   = document.getElementById('canvas');
const ctx      = canvas.getContext('2d');
const loading  = document.getElementById('loading-overlay');
const ph       = document.getElementById('placeholder');
const annList  = document.getElementById('ann-list');
const legend   = document.getElementById('legend');

// ── Init ─────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => { buildLegend(); loadSplit('train'); });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft')  navigate(-1);
  if (e.key === 'ArrowRight') navigate(1);
  if (e.key === 'b' || e.key === 'B') toggleOverlay();
});
window.addEventListener('resize', () => { if (S.currentImg) drawCanvas(); });

// ── Split ─────────────────────────────────────────────────────────────────────
function changeSplit(s) {
  S.split = s;
  S.imgCache = {};     // clear cache when switching split
  S.labelCache = {};
  ['train','valid','test'].forEach(t =>
    document.getElementById('tab-'+t).classList.toggle('active', t === s));
  loadSplit(s);
}

async function loadSplit(split) {
  showLoading(true);
  const r = await fetch(BASE_URL + `/api/images?split=${split}`);
  const d = await r.json();
  S.images = d.images;
  S.index  = 0;
  document.getElementById('total-count').textContent = d.count;

  if (d.count === 0) {
    ph.style.display = 'flex';
    canvas.style.display = 'none';
    showLoading(false);
    return;
  }
  ph.style.display = 'none';
  canvas.style.display = 'block';

  // Pre-fetch labels for first batch
  await prefetchLabels(split, 0, Math.min(10, d.count));
  await showImage(0);
}

// ── Label prefetch (batch API) ───────────────────────────────────────────────
async function prefetchLabels(split, startIdx, endIdx) {
  const names = [];
  for (let i = startIdx; i < endIdx; i++) {
    const key = split + '/' + S.images[i];
    if (S.labelCache[key] === undefined) names.push(S.images[i]);
  }
  if (!names.length) return;
  try {
    const r = await fetch(BASE_URL + `/api/labels_batch`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ split, images: names })
    });
    const data = await r.json();
    for (const [name, boxes] of Object.entries(data))
      S.labelCache[split + '/' + name] = boxes;
  } catch(e) { /* ignore */ }
}

// ── Image preload ─────────────────────────────────────────────────────────────
function preloadImg(split, name) {
  const key = split + '/' + name;
  if (S.imgCache[key]) return S.imgCache[key];
  const img = new Image();
  img.src = BASE_URL + `/images/${split}/${name}`;
  S.imgCache[key] = img;
  return img;
}

function triggerPreload(idx) {
  const sp = S.split;
  // Preload ahead
  for (let i = idx + 1; i <= idx + PRELOAD_AHEAD && i < S.images.length; i++)
    preloadImg(sp, S.images[i]);
  // Preload behind (1)
  if (idx > 0) preloadImg(sp, S.images[idx - 1]);

  // Prefetch labels for next batch
  const end = Math.min(idx + PRELOAD_AHEAD + 1, S.images.length);
  prefetchLabels(sp, idx, end);

  // Update dots
  updatePreloadDots(idx);
}

function updatePreloadDots(idx) {
  const sp = S.split;
  const loaded = n => {
    const k = sp+'/'+n;
    const img = S.imgCache[k];
    return img && img.complete && img.naturalWidth > 0;
  };
  document.getElementById('pd-prev').classList.toggle('loaded', idx > 0 && loaded(S.images[idx-1]));
  document.getElementById('pd-curr').classList.toggle('loaded', loaded(S.images[idx]));
  document.getElementById('pd-next').classList.toggle('loaded', idx < S.images.length-1 && loaded(S.images[idx+1]));
}

// ── Navigate ──────────────────────────────────────────────────────────────────
function navigate(dir) {
  const n = S.index + dir;
  if (n < 0 || n >= S.images.length) return;
  showImage(n);
}
function jumpTo() {
  const v = parseInt(document.getElementById('jump-input').value);
  if (isNaN(v)) return;
  showImage(Math.max(0, Math.min(S.images.length-1, v-1)));
  document.getElementById('jump-input').value = '';
}

// ── Show image ───────────────────────────────────────────────────────────────
async function showImage(idx) {
  S.index = idx;
  S.highlighted = -1;
  const name = S.images[idx];

  document.getElementById('img-name-display').textContent = name;
  document.getElementById('img-counter').textContent = `${idx+1} / ${S.images.length}`;
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').disabled = idx === S.images.length-1;

  // Get or start loading image
  const key = S.split + '/' + name;
  let img = S.imgCache[key];
  if (!img) { img = preloadImg(S.split, name); }

  const alreadyLoaded = img.complete && img.naturalWidth > 0;
  if (!alreadyLoaded) {
    showLoading(true);
    await new Promise((res, rej) => {
      img.onload  = res;
      img.onerror = rej;
    });
  }
  S.currentImg = img;

  // Get labels (from cache or fetch)
  let boxes = S.labelCache[key];
  if (boxes === undefined) {
    try {
      const r = await fetch(BASE_URL + `/api/labels?split=${S.split}&image=${encodeURIComponent(name)}`);
      const d = await r.json();
      boxes = d.boxes;
      S.labelCache[key] = boxes;
    } catch(e) { boxes = []; }
  }
  S.boxes = boxes;

  showLoading(false);
  drawCanvas();
  renderAnnotations();

  // Fire preload for neighbours
  triggerPreload(idx);

  document.getElementById('img-w').textContent = img.naturalWidth;
  document.getElementById('img-h').textContent = img.naturalHeight;
}

// ── Canvas draw ───────────────────────────────────────────────────────────────
function drawCanvas() {
  const img = S.currentImg;
  if (!img) return;
  const wrap = document.getElementById('canvas-wrapper');
  const maxW = wrap.clientWidth  - 48;
  const maxH = wrap.clientHeight - 48;
  const scale = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight, 1);
  canvas.width  = img.naturalWidth  * scale;
  canvas.height = img.naturalHeight * scale;

  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  if (!S.showOverlay) return;

  S.boxes.forEach((box, i) => {
    const col  = CLASS_COLORS[box.class_id % CLASS_COLORS.length];
    const x    = (box.cx - box.w/2) * canvas.width;
    const y    = (box.cy - box.h/2) * canvas.height;
    const w    = box.w * canvas.width;
    const h    = box.h * canvas.height;
    const isHl = (i === S.highlighted);

    ctx.fillStyle   = col + (isHl ? '33' : '1a');
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = col;
    ctx.lineWidth   = isHl ? 2.5 : 1.5;
    ctx.strokeRect(x, y, w, h);

    // Label
    const label = `${i+1}. ${box.class_name}`;
    ctx.font = 'bold 11px Inter,sans-serif';
    const tw  = ctx.measureText(label).width;
    const lx  = x;
    const ly  = y - 18 < 0 ? y + h : y - 2;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.roundRect(lx, ly-14, tw+10, 18, 4);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.fillText(label, lx+5, ly);
  });
}

// ── Annotation panel ──────────────────────────────────────────────────────────
function renderAnnotations() {
  const boxes = S.boxes;
  document.getElementById('box-count').textContent  = boxes.length;
  document.getElementById('class-count').textContent = new Set(boxes.map(b=>b.class_id)).size;

  if (!boxes.length) {
    annList.innerHTML = `<div class="empty-ann"><div style="font-size:32px;opacity:.3">✅</div><span>No annotations</span></div>`;
    return;
  }
  annList.innerHTML = '';
  boxes.forEach((box, i) => {
    const col  = CLASS_COLORS[box.class_id % CLASS_COLORS.length];
    const W    = S.currentImg?.naturalWidth  || 0;
    const H    = S.currentImg?.naturalHeight || 0;
    const px   = (v, d) => d ? Math.round(v*d) : '—';
    const x1   = px(box.cx-box.w/2, W), y1 = px(box.cy-box.h/2, H);
    const x2   = px(box.cx+box.w/2, W), y2 = px(box.cy+box.h/2, H);
    const wPx  = px(box.w, W),           hPx = px(box.h, H);

    const el = document.createElement('div');
    el.className = 'ann-item';
    el.style.animationDelay = `${i*25}ms`;
    el.innerHTML = `
      <div class="ann-header">
        <div class="ann-dot" style="background:${col}"></div>
        <div class="ann-name" style="color:${col}">${box.class_name}</div>
        <div class="ann-id-badge">#${i+1} · cls ${box.class_id}</div>
      </div>
      <div class="ann-coords">
        <div class="ann-coord"><span class="ann-coord-key">cx</span><span class="ann-coord-val">${box.cx.toFixed(4)}</span></div>
        <div class="ann-coord"><span class="ann-coord-key">cy</span><span class="ann-coord-val">${box.cy.toFixed(4)}</span></div>
        <div class="ann-coord"><span class="ann-coord-key">w</span> <span class="ann-coord-val">${box.w.toFixed(4)}</span></div>
        <div class="ann-coord"><span class="ann-coord-key">h</span> <span class="ann-coord-val">${box.h.toFixed(4)}</span></div>
        <div class="ann-coord"><span class="ann-coord-key">x₁,y₁</span><span class="ann-coord-val">${x1},${y1}</span></div>
        <div class="ann-coord"><span class="ann-coord-key">x₂,y₂</span><span class="ann-coord-val">${x2},${y2}</span></div>
        <div class="ann-coord"><span class="ann-coord-key">size</span><span class="ann-coord-val">${wPx}×${hPx}px</span></div>
      </div>`;
    el.addEventListener('mouseenter', () => { S.highlighted=i; drawCanvas(); el.classList.add('highlighted'); });
    el.addEventListener('mouseleave', () => { S.highlighted=-1; drawCanvas(); el.classList.remove('highlighted'); });
    annList.appendChild(el);
  });
}

// ── Legend ────────────────────────────────────────────────────────────────────
function buildLegend() {
  CLASS_NAMES.forEach((name, i) => {
    const row = document.createElement('div');
    row.className = 'legend-row';
    row.innerHTML = `
      <div class="legend-swatch" style="background:${CLASS_COLORS[i]}"></div>
      <div class="legend-cls">${name}</div>`;
    legend.appendChild(row);
  });
}

// ── Toggle & helpers ──────────────────────────────────────────────────────────
function toggleOverlay() {
  S.showOverlay = !S.showOverlay;
  const btn = document.getElementById('overlay-toggle');
  btn.classList.toggle('on', S.showOverlay);
  btn.querySelector('.toggle-dot').style.background = S.showOverlay ? 'var(--accent)' : 'var(--muted)';
  document.getElementById('toggle-label').textContent = S.showOverlay ? '\u00a0Show Boxes' : '\u00a0Hide Boxes';
  drawCanvas();
}
function showLoading(v) { loading.classList.toggle('visible', v); }
</script>
</body>
</html>
